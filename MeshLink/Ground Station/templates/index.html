<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshLink Ground Station</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<!-- Top bar contains the app title, COM port selector, connection status, and reconnect button. -->
<div class="top-bar">
    <div>
        <h1>MeshLink Ground Station</h1>
    </div>
    <div class="status-block">
        <label class="status-label">
            COM Port
            <select id="port-select" class="status-select"></select>
        </label>
        <span id="connection-status" class="status-badge disconnected">Meshtastic: disconnected</span>
        <button id="reconnect-button" class="status-button" onclick="reconnectMeshtastic()">Connect</button>
    </div>
</div>
<div class="container">
    <div class="sidebar">
        <div class="section">
            <h2>Commands</h2>
            <button onclick="sendCommand(1)">RTL</button>
            <button onclick="sendCommand(2)">LOITER</button>
            <button onclick="sendCommand(3)">AUTO</button>
            <button onclick="sendCommand(4)">REQUEST STATUS</button>
            <button onclick="sendCommand(5)">REQUEST TELEMETRY</button>
            <button onclick="sendCommand(6)">REBOOT BRIDGE</button>
        </div>
        <div class="section">
            <h2>Mode</h2>
            <label><input type="radio" name="mode" value="waypoint" checked> Add waypoint</label><br>
            <label><input type="radio" name="mode" value="loiter"> Guided loiter</label>
        </div>
        <div class="section">
            <h2>Vehicles</h2>
            <div id="vehicle-list">Loading vehicles...</div>
        </div>
        <div class="section">
            <h2>Selected Vehicle</h2>
            <div id="vehicle-info">Loading vehicle status...</div>
        </div>
        <div class="section">
            <h2>Mission</h2>
            <button onclick="uploadMission()">Upload Mission</button>
            <button onclick="clearMission()">Clear Mission</button>
            <div id="waypoint-list"></div>
        </div>
        <div class="section">
            <h2>Debug</h2>
            <button onclick="sendTestText()">Send Test Text</button>
        </div>
        <div class="section">
            <h2>Log</h2>
            <textarea id="log" readonly></textarea>
        </div>
    </div>
    <div class="map-panel">
        <div id="map"></div>
    </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
